name: Publicar SIFER360 LICORERÍA v1.1.3

on:
  push:
    branches:
      - release/v1.0.0
    paths:
      - '.release-trigger-v1.1.3'

permissions:
  contents: write

concurrency:
  group: sifer360-release-v1.1.3
  cancel-in-progress: false

jobs:
  windows-build:
    name: Compilar y validar paquete Windows 1.1.3
    runs-on: windows-latest
    steps:
      - name: Checkout del commit integrado
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Configurar Google Drive OAuth opcional
        env:
          SIFER360_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.SIFER360_GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          node -e "const fs=require('fs'); const id=String(process.env.SIFER360_GOOGLE_OAUTH_CLIENT_ID||'').trim(); if(id && !id.endsWith('.apps.googleusercontent.com')) throw new Error('Google OAuth Desktop Client ID inválido.'); fs.writeFileSync('electron/google-drive-oauth.json', JSON.stringify({clientId:id,comment:'Google OAuth Desktop client ID; no client secret.'}, null, 2)); console.log(id ? 'Google Drive OAuth configurado.' : 'Google Drive permanece opcional y desactivado hasta configurar OAuth.');"

      - name: Ejecutar pruebas automatizadas
        run: npm test

      - name: Validar TypeScript
        run: npm run lint

      - name: Compilar interfaz
        run: npm run build

      - name: Construir instalador y portable Windows
        run: npx --yes electron-builder --win --config electron-builder.json --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar versión y artefactos requeridos
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($package.version -ne '1.1.3') { throw "package.json declara $($package.version), se esperaba 1.1.3" }
          $required = @('SIFER360-1.1.3-Instalador.exe','SIFER360-1.1.3-Portable.exe','latest.yml')
          foreach ($name in $required) {
            $file = Get-ChildItem -Path dist-exe -Filter $name -File | Select-Object -First 1
            if (-not $file -or $file.Length -lt 20) { throw "Falta artefacto requerido: $name" }
            Write-Host "$name ($($file.Length) bytes)"
          }

      - name: Guardar paquete Windows validado
        uses: actions/upload-artifact@v5
        with:
          name: SIFER360-1.1.3-Windows-Release-Package
          path: |
            dist-exe/SIFER360-1.1.3-Instalador.exe
            dist-exe/SIFER360-1.1.3-Portable.exe
            dist-exe/*.blockmap
            dist-exe/latest.yml
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publicar GitHub Release v1.1.3
    needs: windows-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del commit validado
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Descargar paquete validado
        uses: actions/download-artifact@v5
        with:
          name: SIFER360-1.1.3-Windows-Release-Package
          path: release-assets

      - name: Verificar instalador, portable y metadatos
        run: |
          test -s release-assets/SIFER360-1.1.3-Instalador.exe
          test -s release-assets/SIFER360-1.1.3-Portable.exe
          test -s release-assets/latest.yml

      - name: Crear tag y publicar Release oficial
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.1.3 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "La release v1.1.3 ya existe; se cancela para no sobrescribir una publicación." >&2
            exit 1
          fi
          gh release create v1.1.3 release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "SIFER360 LICORERÍA v1.1.3" \
            --notes-file RELEASE_NOTES_1.1.3.md \
            --latest
