name: Compilar Ejecutable Windows (.exe)

concurrency:
  group: sifer360-licoreria-windows-release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master, integration/sqlite-lan-stage-1, integration/sqlite-lan-stage-2-hardening, feature/fiscal-sdk-architecture-validation, feature/google-drive-automatic-backups ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, integration/sqlite-lan-stage-1, release/v1.0.0 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Validar e inyectar OAuth Client ID público de Google Drive
        env:
          SIFER360_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.SIFER360_GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          node -e "const id=String(process.env.SIFER360_GOOGLE_OAUTH_CLIENT_ID||'').trim(); if(id && !id.endsWith('.apps.googleusercontent.com')) throw new Error('SIFER360_GOOGLE_OAUTH_CLIENT_ID no tiene formato de Client ID de Google.'); require('fs').writeFileSync('electron/google-drive-oauth.json', JSON.stringify({clientId:id}, null, 2)); console.log(id ? 'Google OAuth Client ID configurado (valor oculto).' : 'Google Drive queda desactivado: falta configurar el Client ID opcional. El POS y el instalador continúan compilándose.');"

      - name: Ejecutar pruebas de regresión
        run: npm test

      - name: Compilar aplicación web (Vite)
        run: npm run build

      - name: Construir instalador y portable de Windows (.exe)
        run: npx --yes electron-builder --win --config electron-builder.json --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar ejecutable como artefacto privado de CI
        uses: actions/upload-artifact@v5
        with:
          name: SIFER360-Licoreria-Windows-Installer-and-Portable
          path: dist-exe/*.exe
          if-no-files-found: error
          retention-days: 30
