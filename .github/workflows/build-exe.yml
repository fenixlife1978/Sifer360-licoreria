name: Compilar Ejecutable Windows (.exe)

concurrency:
  group: sifer360-licoreria-windows-release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Ejecutar pruebas de regresión
        run: npm test

      - name: Compilar aplicación web (Vite)
        run: npm run build

      - name: Construir ejecutable portátil de Windows (.exe)
        run: npx --yes electron-builder --win portable --config electron-builder.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar ejecutable descargable en GitHub Releases
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "windows-portable-latest"
          $existing = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes
            if ($LASTEXITCODE -ne 0) { throw "No se pudo reemplazar el release anterior." }
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" 2>$null
          }
          $exe = Get-ChildItem -Path "dist-exe" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No se encontró el .exe compilado en dist-exe." }
          $notes = "Ejecutable portable de SIFER360 Licorería. Commit fuente: $env:GITHUB_SHA. Este artefacto se reemplaza con cada build de main."
          gh release create $tag $exe.FullName --target $env:GITHUB_SHA --title "SIFER360 Licorería · Windows portable (último build)" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { throw "No se pudo publicar el .exe en GitHub Releases." }
