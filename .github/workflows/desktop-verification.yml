name: Desktop verification

on:
  push:
    branches:
      - auto-depreciacion-mensual
      - integration/sqlite-lan-stage-1
      - integration/sqlite-lan-stage-2-hardening
      - feature/fiscal-printer-auto-assistant
      - feature/printer-duality-shared-fiscal-v1.0.6
      - feature/fiscal-sdk-architecture-validation
      - feature/dual-printer-manager
      - integration/crm-licensing-telemetry-1.0.5
  pull_request:
    branches:
      - main
      - master
      - integration/sqlite-lan-stage-1
      - release/v1.0.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install
      - run: npm test
      - run: node --check electron/main.cjs && node --check electron/licensing.cjs && node --check electron/preload.cjs && node --check electron/printer-manager.cjs && node --check electron/legacy-backup-task.cjs && node --check electron/binary-architecture.cjs && node --check public/main.js && node --check public/access.js && node --check public/licensing.js && node --check public/licensing.js
      - run: npm run build

  windows-desktop-package:
    needs: test-and-web-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install
      - run: npm test
      - run: node --check electron/main.cjs && node --check electron/licensing.cjs && node --check electron/preload.cjs && node --check electron/printer-manager.cjs && node --check public/main.js && node --check public/access.js && node --check public/licensing.js && node --check electron/lan-outbox.cjs && node --check electron/lan-tls.cjs && node --check electron/lan-event-store.cjs && node --check electron/lan-state-merge.cjs && node --check electron/sqlite-recovery.cjs && node --check electron/lan-address.cjs && node --check electron/lan-auth.cjs && node --check electron/cashbox-sequence.cjs && node --check electron/cashbox-sequence-migration.cjs && node --check electron/binary-architecture.cjs
      - run: npm run build:exe
      - uses: actions/upload-artifact@v5
        with:
          name: SIFER360-1.1.2-Windows-Desktop
          path: dist-exe/*.exe
          if-no-files-found: error
