name: POS checks

on:
  push:
    branches: [main, integration/sqlite-lan-stage-1, integration/sqlite-lan-stage-2-hardening, feature/fiscal-printer-auto-assistant, feature/fiscal-sdk-architecture-validation, feature/dual-printer-manager, integration/google-drive-1.0.4, integration/crm-licensing-telemetry-1.0.5]
  pull_request:
    branches: [main, integration/sqlite-lan-stage-1, release/v1.0.0]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Automated tests
        run: npm test
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
