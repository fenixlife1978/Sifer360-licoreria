name: SIFER360 1.0.8 Local Desktop and SQLite validation

on:
  push:
    branches:
  pull_request:
    branches:
      - release/v1.0.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sifer360-108-desktop-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-validation:
    name: Local Desktop and SQLite validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v6
      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Run complete automated tests
        run: npm test
      - name: Validate desktop JavaScript syntax
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/binary-architecture.cjs
          node --check public/main.js
          node --check public/access.js
      - name: Build production web assets
        run: npm run build

  windows-installer:
    name: Build Windows installer and portable executable
    needs: desktop-validation
    runs-on: windows-latest
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v6
      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Inject public Google OAuth Desktop Client ID
        env:
          SIFER360_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.SIFER360_GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          node -e "const id=String(process.env.SIFER360_GOOGLE_OAUTH_CLIENT_ID||'').trim(); if(!id || !id.endsWith('.apps.googleusercontent.com')) throw new Error('Falta SIFER360_GOOGLE_OAUTH_CLIENT_ID válido.'); require('fs').writeFileSync('electron/google-drive-oauth.json', JSON.stringify({ clientId:id }, null, 2))"
      - name: Run complete automated tests
        run: npm test
      - name: Build Windows installer and portable executable
        run: npm run build:exe
      - name: Upload SIFER360 1.0.8 Windows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: SIFER360-1.0.8-Desktop-SQLite-Windows
          path: dist-exe/*.exe
          if-no-files-found: error
          retention-days: 30
