name: Publicar SIFER360 LICORERÍA 1.0.2

on:
  push:
    branches:
      - release/v1.0.0
    paths:
      - '.release-trigger-v1.0.2'
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publicar o actualizar la Release oficial v1.0.2"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event_name == 'push' || inputs.publish_release == true }}
    name: Alinear tag y notas de la Release 1.0.2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Alinear el tag v1.0.2 con el commit integrado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force v1.0.2 "$GITHUB_SHA"
          git push origin refs/tags/v1.0.2 --force

      - name: Actualizar Release oficial v1.0.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          target_commitish: ${{ github.sha }}
          name: SIFER360 LICORERÍA v1.0.2
          body_path: RELEASE_NOTES_1.0.2.md
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-artifact:
    name: Generar artefacto descargable Windows v1.0.2
    runs-on: windows-latest
    steps:
      - name: Clonar versión integrada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Ejecutar pruebas de regresión
        run: npm test

      - name: Compilar aplicación web
        run: npm run build

      - name: Construir ejecutable portátil Windows
        run: npx --yes electron-builder --win portable --config electron-builder.json --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar artefacto en Actions
        uses: actions/upload-artifact@v4
        with:
          name: SIFER360-Licoreria-v1.0.2-Windows-Portable
          path: dist-exe/*.exe
          if-no-files-found: error
          retention-days: 30
